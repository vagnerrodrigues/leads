<!DOCTYPE html>

<style>
  *{box-sizing:border-box;margin:0;padding:0}
  body{background:#0f172a;color:#e2e8f0;font-family:Inter,system-ui,sans-serif}
  input,select,button{font-family:inherit}
  ::-webkit-scrollbar{width:6px;height:6px}
  ::-webkit-scrollbar-track{background:#0f172a}
  ::-webkit-scrollbar-thumb{background:#334155;border-radius:3px}
  .login-wrap{min-height:100vh;background:#0f172a;display:flex;align-items:center;justify-content:center}
  .login-box{background:#1e293b;border-radius:14px;padding:36px 32px;width:300px;border:1px solid #334155}
  .login-icon{text-align:center;font-size:32px;margin-bottom:8px}
  .login-title{text-align:center;font-weight:700;font-size:18px;color:#fff}
  .login-sub{text-align:center;font-size:12px;color:#64748b;margin-top:4px;margin-bottom:28px}
  .field-label{font-size:11px;color:#94a3b8;margin-bottom:5px;display:block}
  .field-wrap{margin-bottom:12px}
  .field-input{width:100%;padding:9px 12px;border-radius:8px;background:#0f172a;color:#e2e8f0;font-size:13px;outline:none;border:1px solid #334155}
  .field-input.err{border-color:#dc2626}
  .field-wrap-last{margin-bottom:20px}
  .login-err{font-size:12px;color:#dc2626;margin-bottom:12px;text-align:center}
  .btn-login{width:100%;padding:10px;border-radius:8px;border:none;background:#3b82f6;color:#fff;font-weight:700;font-size:14px;cursor:pointer}
  .app{background:#0f172a;min-height:100vh;color:#e2e8f0}
  .header{border-bottom:1px solid #1e293b;padding:16px 24px}
  .header-title{font-weight:700;font-size:16px;color:#fff}
  .header-sub{font-size:11px;color:#64748b}
  .tabs{display:flex;gap:4px;padding:12px 24px 0;border-bottom:1px solid #1e293b;flex-wrap:wrap}
  .tab-btn{padding:8px 16px;border-radius:6px 6px 0 0;border:none;cursor:pointer;font-weight:600;font-size:13px;background:transparent;color:#64748b;border-bottom:2px solid transparent}
  .tab-btn.active{background:#1e293b;color:#3b82f6;border-bottom:2px solid #3b82f6}
  .content{padding:20px 24px}
  .kpis{display:grid;grid-template-columns:repeat(5,1fr);gap:12px;margin-bottom:20px}
  .kpi{background:#1e293b;border-radius:10px;padding:14px 16px}
  .kpi-icon{font-size:18px;margin-bottom:4px}
  .kpi-val{font-size:20px;font-weight:700}
  .kpi-sub{font-size:11px;color:#64748b}
  .kpi-label{font-size:11px;color:#94a3b8;margin-top:2px}
  .card{background:#1e293b;border-radius:10px;padding:16px}
  .card-title{font-weight:700;margin-bottom:12px;color:#fff;font-size:14px}
  .grid2{display:grid;grid-template-columns:1fr 1fr;gap:16px}
  table{width:100%;border-collapse:collapse;font-size:12px}
  th{padding:8px 10px;text-align:left;color:#64748b;font-size:11px;font-weight:700;white-space:nowrap;background:#0f172a}
  td{padding:8px 10px}
  .badge{font-size:10px;font-weight:700;padding:2px 8px;border-radius:20px;display:inline-block}
  .search-row{display:flex;gap:10px;margin-bottom:14px}
  .search-input{flex:1;padding:8px 12px;border-radius:8px;border:1px solid #334155;background:#1e293b;color:#e2e8f0;font-size:13px;outline:none}
  .filter-sel{padding:8px 12px;border-radius:8px;border:1px solid #334155;background:#1e293b;color:#e2e8f0;font-size:13px;outline:none}
  .table-wrap{background:#1e293b;border-radius:10px;overflow:hidden}
  .table-head{display:grid;grid-template-columns:2fr 2fr 1.5fr 1fr 1fr 1.5fr;padding:10px 14px;background:#0f172a;font-size:11px;font-weight:700;color:#64748b;gap:8px}
  .table-body{max-height:60vh;overflow-y:auto}
  .table-row{display:grid;grid-template-columns:2fr 2fr 1.5fr 1fr 1fr 1.5fr;padding:9px 14px;gap:8px;align-items:center;border-bottom:1px solid #0f172a20;font-size:12px}
  .table-foot{padding:8px 14px;font-size:11px;color:#475569;background:#0f172a}
  .bar-track{height:8px;background:#0f172a;border-radius:4px}
  .bar-fill{height:8px;border-radius:4px}
  .hm-group{margin-bottom:14px}
  .hm-header{display:flex;align-items:center;gap:8px;margin-bottom:8px}
  .dot{width:12px;height:12px;border-radius:50%;flex-shrink:0}
  .hm-cards{display:flex;flex-wrap:wrap;gap:6px}
  .hm-card{border-radius:8px;padding:6px 10px;min-width:110px}
  .comp-grid{display:grid;grid-template-columns:repeat(4,1fr);gap:6px;margin-bottom:8px}
  .comp-cell{border-radius:6px;padding:5px 4px;text-align:center;font-size:10px;font-weight:600}
  .status-item{display:flex;align-items:center;justify-content:space-between;padding:10px 12px;border-radius:8px;margin-bottom:8px}
  .attn-item{padding:10px 12px;border-radius:8px;margin-bottom:8px}
</style>
</head>

const fmt=v=>v>0?'R$ '+v.toLocaleString('pt-BR',{minimumFractionDigits:2,maximumFractionDigits:2}):'—';
const fmtK=v=>v>=1000?'R$ '+(v/1000).toLocaleString('pt-BR',{minimumFractionDigits:0,maximumFractionDigits:0})+'k':fmt(v);
const fmtD=d=>new Date(d+'T12:00:00').toLocaleDateString('pt-BR');
const TODAY=new Date();
const diffDays=d=>Math.round((new Date(d+'T12:00:00')-TODAY)/864e5);
const SC={"OK":"#16a34a","VENCIDO":"#dc2626","URGENTE":"#f97316","PRAZO PERDIDO":"#9333ea","":"#3b82f6"};
const SB={"OK":"#dcfce7","VENCIDO":"#fee2e2","URGENTE":"#ffedd5","PRAZO PERDIDO":"#f3e8ff","":"#dbeafe"};
const GRUPOS=[
  {label:"Vencido / Prazo perdido",min:-9999,max:-1,color:"#dc2626",bg:"#fee2e2"},
  {label:"Notificar AGORA (0–30d)",min:0,max:30,color:"#ea580c",bg:"#ffedd5"},
  {label:"Notificar em breve (31–90d)",min:31,max:90,color:"#d97706",bg:"#fef3c7"},

  {label:"Seguro (>365d)",min:366,max:9999,color:"#6b7280",bg:"#f1f5f9"},
];
let auth=false,tab='overview',search='',filtStatus='Todos';
function getData(){
  const totalRec=raw.reduce((s,r)=>s+r.val,0);
  const comValor=raw.filter(r=>r.val>0).length;
  const vencidos=raw.filter(r=>r.status==='VENCIDO').length;
  const curvaA=raw.filter(r=>r.curva==='A').length;
  const porSeg=(()=>{const m={};raw.forEach(r=>{const s=r.seg||'Sem segmento';if(!m[s])m[s]={seg:s,val:0,count:0};m[s].val+=r.val;m[s].count++;});return Object.values(m).sort((a,b)=>b.val-a.val).slice(0,10);})();
  const maxSeg=porSeg[0]?.val||1;
  const statusCount=(()=>{const m={};raw.forEach(r=>{const s=r.status||'Ativo';m[s]=(m[s]||0)+1;});return m;})();
  const topC=[...raw].filter(r=>r.val>0).sort((a,b)=>b.val-a.val).slice(0,10);
  const dlData=raw.filter(r=>r.deadline).map(r=>({...r,ddDias:diffDays(r.deadline),vencDias:r.venc?diffDays(r.venc):null})).sort((a,b)=>a.ddDias-b.ddDias);
  const proximos=dlData.filter(r=>r.ddDias>=-60).slice(0,20);
  const lista=raw.filter(r=>{
    const ms=search===''||r.c.toLowerCase().includes(search.toLowerCase())||(r.seg||'').toLowerCase().includes(search.toLowerCase());
    const mf=filtStatus==='Todos'||r.status===filtStatus||(filtStatus==='Ativo'&&r.status==='');
    return ms&&mf;
  });
  return{totalRec,comValor,vencidos,curvaA,porSeg,maxSeg,statusCount,topC,dlData,proximos,lista};
}

}
function bindLogin(){
  function doLogin(){
    const u=document.getElementById('inp-user').value.trim().toLowerCase();
    const p=document.getElementById('inp-pass').value;
    if(u==='bos'&&p==='bos'){auth=true;render();}
    else{document.getElementById('root').innerHTML=renderLogin(true);bindLogin();}
  }
  document.getElementById('btn-login').addEventListener('click',doLogin);
  document.getElementById('inp-pass').addEventListener('keydown',e=>{if(e.key==='Enter')doLogin();});
}

function renderDeadlines(d){
  const heatmap=GRUPOS.map(g=>{
    const cl=d.dlData.filter(r=>r.ddDias>=g.min&&r.ddDias<=g.max);
    if(!cl.length)return'';
    const cards=cl.map(r=>`
      <div class="hm-card" style="background:${g.bg};border:1px solid ${g.color}40">
        <div style="font-size:11px;font-weight:700;color:#1e293b">${r.c}</div>
        <div style="font-size:10px;color:#475569">Deadline: ${fmtD(r.deadline)}</div>
        <div style="font-size:10px;color:${g.color};font-weight:600">${r.ddDias<0?'Atrasado '+Math.abs(r.ddDias)+'d':r.ddDias+'d p/ notif.'}</div>
        ${r.venc?`<div style="font-size:10px;color:#64748b">Vence: ${fmtD(r.venc)}</div>`:''}
        ${r.val>0?`<div style="font-size:10px;color:#64748b">${fmtK(r.val)}</div>`:''}
      </div>`).join('');
    return `<div class="hm-group">
      <div class="hm-header">
        <div class="dot" style="background:${g.color}"></div>
        <span style="font-size:12px;font-weight:700;color:${g.color}">${g.label}</span>
        <span style="font-size:11px;color:#64748b">(${cl.length})</span>
      </div>
      <div class="hm-cards">${cards}</div>
    </div>`;
  }).join('');
  const tableRows=d.proximos.map((r,i)=>{
    const g=GRUPOS.find(g=>r.ddDias>=g.min&&r.ddDias<=g.max)||GRUPOS[5];
    const nc=r.ddDias<=0?'#dc2626':r.ddDias<=30?'#ea580c':r.ddDias<=90?'#d97706':'#16a34a';
    return `<tr style="border-bottom:1px solid #0f172a20;background:${i%2===0?'#1e293b':'#172033'}">
      <td style="color:#64748b">${i+1}</td>
      <td style="font-weight:700;color:#e2e8f0">${r.c}</td>
      <td style="color:#3b82f6;font-weight:700">${r.val>0?fmtK(r.val):'—'}</td>
      <td style="color:#94a3b8">${fmtD(r.deadline)}</td>
      <td style="color:${g.color};font-weight:700">${r.ddDias<0?'-'+Math.abs(r.ddDias)+'d':r.ddDias+'d'}</td>
      <td style="color:#94a3b8">${r.venc?fmtD(r.venc):'—'}</td>
      <td><span class="badge" style="color:${nc};background:${nc}20">${r.ddDias<=0?'⚡ AGORA':r.ddDias+'d'}</span></td>
    </tr>`;
  }).join('');
  return `<div style="display:flex;flex-direction:column;gap:16px">
    <div class="card">
      <div class="card-title">🗓 Mapa de Calor — Deadline de Notificação</div>
      <div style="font-size:11px;color:#64748b;margin-bottom:14px">Calculado dinamicamente pela data de hoje</div>
      ${heatmap}
    </div>
    <div class="card">
      <div class="card-title">🎯 Próximos a Atacar</div>
      <div style="overflow-x:auto">
        <table>
          <thead><tr>${['#','Cliente','MRR','Deadline','Dias','Vencimento','Urgência'].map(h=>`<th>${h}</th>`).join('')}</tr></thead>
          <tbody>${tableRows}</tbody>

}

      <div style="display:flex;align-items:center;gap:8px">
        <div style="width:10px;height:10px;border-radius:50%;background:${SC[s]||'#3b82f6'}"></div>
        <span style="font-size:13px;color:#1e293b;font-weight:600">${s||'Ativo'}</span>
      </div>
      <span style="font-size:16px;font-weight:700;color:${SC[s]||'#3b82f6'}">${n}</span>
    </div>`).join('');
  const attnItems=raw.filter(r=>r.status==='VENCIDO'||r.status==='URGENTE'||r.status==='PRAZO PERDIDO').map(r=>`
    <div class="attn-item" style="background:${SB[r.status]};border:1px solid ${SC[r.status]}40">
      <div style="display:flex;justify-content:space-between;align-items:center">
        <span style="font-size:13px;font-weight:700;color:#1e293b">${r.c}</span>
        <span class="badge" style="color:${SC[r.status]};background:${SC[r.status]}20">${r.status}</span>
      </div>
      <div style="font-size:11px;color:#475569;margin-top:2px">${r.val>0?fmt(r.val):'Sem valor'} · ${r.seg||'—'}</div>
    </div>`).join('');
  return `<div class="grid2">
    <div class="card"><div class="card-title">📌 Por Status</div>${statusItems}</div>
    <div class="card"><div class="card-title">🚨 Atenção Imediata</div>${attnItems}</div>
  </div>`;
}
function renderLista(d){
  const rows=d.lista.map((r,i)=>`
    <div class="table-row" style="background:${i%2===0?'#1e293b':'#172033'}">
      <span style="font-weight:600;color:#e2e8f0">${r.c}</span>
      <span style="color:#94a3b8">${r.seg||'—'}</span>
      <span style="color:#3b82f6;font-weight:700">${r.val>0?fmtK(r.val):'—'}</span>
      <span style="color:#8b5cf6;font-weight:700">${r.curva||'—'}</span>
      <span class="badge" style="color:${SC[r.status]||'#3b82f6'};background:${SC[r.status]||'#3b82f6'}20">${r.status||'Ativo'}</span>
      <span style="color:#f59e0b;font-size:11px">${r.deadline?fmtD(r.deadline):'—'}</span>
    </div>`).join('');
  return `<div>
    <div class="search-row">
      <input id="inp-search" class="search-input" placeholder="🔍 Buscar..." value="${search}"/>
      <select id="sel-status" class="filter-sel">
        <option${filtStatus==='Todos'?' selected':''}>Todos</option>
        <option${filtStatus==='OK'?' selected':''}>OK</option>
        <option${filtStatus==='VENCIDO'?' selected':''}>VENCIDO</option>
        <option${filtStatus==='URGENTE'?' selected':''}>URGENTE</option>
        <option${filtStatus==='PRAZO PERDIDO'?' selected':''}>PRAZO PERDIDO</option>
        <option${filtStatus==='Ativo'?' selected':''}>Ativo</option>
      </select>
    </div>
    <div class="table-wrap">
      <div class="table-head"><span>CLIENTE</span><span>SEGMENTO</span><span>MRR</span><span>CURVA</span><span>STATUS</span><span>DEADLINE</span></div>
      <div class="table-body">${rows}</div>
      <div class="table-foot">${d.lista.length} registros</div>
    </div>
  </div>`;
}
function renderApp(d){
  let tabContent='';
  if(tab==='overview')tabContent=renderOverview(d);
  else if(tab==='deadlines')tabContent=renderDeadlines(d);
  else if(tab==='segments')tabContent=renderSegments(d);
  else if(tab==='status')tabContent=renderStatus(d);
  else if(tab==='lista')tabContent=renderLista(d);
  return `<div class="app">
    <div class="header">
      <div class="header-title">Dashboard Leads</div>
      <div class="header-sub">${raw.length} clientes</div>
    </div>
    <div class="tabs">${tabButtons()}</div>
    <div class="content">
      <div class="kpis">${kpiCards(d)}</div>
      ${tabContent}
    </div>
  </div>`;
}
function bindApp(){
  document.querySelectorAll('.tab-btn').forEach(btn=>{
    btn.addEventListener('click',()=>{tab=btn.dataset.tab;render();});
  });
  const si=document.getElementById('inp-search');
  if(si)si.addEventListener('input',e=>{search=e.target.value;render();});
  const ss=document.getElementById('sel-status');
  if(ss)ss.addEventListener('change',e=>{filtStatus=e.target.value;render();});
}
render();

</script>
</body>
</html>
