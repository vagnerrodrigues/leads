<html lang="pt-BR">

<meta charset="UTF-8"/>
<meta name="viewport" content="width=device-width,initial-scale=1"/>
<title>Dashboard Leads</title>
<style>
  *{box-sizing:border-box;margin:0;padding:0}
  body{background:#0f172a;color:#e2e8f0;font-family:Inter,system-ui,sans-serif}
  input,select,button{font-family:inherit}
  ::-webkit-scrollbar{width:6px;height:6px}
  ::-webkit-scrollbar-track{background:#0f172a}
  ::-webkit-scrollbar-thumb{background:#334155;border-radius:3px}
  .login-wrap{min-height:100vh;background:#0f172a;display:flex;align-items:center;justify-content:center}
  .login-box{background:#1e293b;border-radius:14px;padding:36px 32px;width:300px;border:1px solid #334155}
  .login-icon{text-align:center;font-size:32px;margin-bottom:8px}
  .login-title{text-align:center;font-weight:700;font-size:18px;color:#fff}
  .login-sub{text-align:center;font-size:12px;color:#64748b;margin-top:4px;margin-bottom:28px}
  .field-label{font-size:11px;color:#94a3b8;margin-bottom:5px;display:block}
  .field-wrap{margin-bottom:12px}
  .field-input{width:100%;padding:9px 12px;border-radius:8px;background:#0f172a;color:#e2e8f0;font-size:13px;outline:none;border:1px solid #334155}
  .field-input.err{border-color:#dc2626}
  .field-wrap-last{margin-bottom:20px}
  .login-err{font-size:12px;color:#dc2626;margin-bottom:12px;text-align:center}
  .btn-login{width:100%;padding:10px;border-radius:8px;border:none;background:#3b82f6;color:#fff;font-weight:700;font-size:14px;cursor:pointer}
  .app{background:#0f172a;min-height:100vh;color:#e2e8f0}
  .header{border-bottom:1px solid #1e293b;padding:16px 24px;display:flex;justify-content:space-between;align-items:center;gap:12px;flex-wrap:wrap}
  .header-title{font-weight:700;font-size:16px;color:#fff}
  .header-sub{font-size:11px;color:#64748b}
  .tabs{display:flex;gap:4px;padding:12px 24px 0;border-bottom:1px solid #1e293b;flex-wrap:wrap}
  .tab-btn{padding:8px 16px;border-radius:6px 6px 0 0;border:none;cursor:pointer;font-weight:600;font-size:13px;background:transparent;color:#64748b;border-bottom:2px solid transparent}
  .tab-btn.active{background:#1e293b;color:#3b82f6;border-bottom:2px solid #3b82f6}
  .content{padding:20px 24px}
  .kpis{display:grid;grid-template-columns:repeat(4,1fr);gap:12px;margin-bottom:20px}
  .kpi{background:#1e293b;border-radius:10px;padding:14px 16px}
  .kpi-icon{font-size:18px;margin-bottom:4px}
  .kpi-val{font-size:20px;font-weight:700}
  .kpi-sub{font-size:11px;color:#64748b}
  .kpi-label{font-size:11px;color:#94a3b8;margin-top:2px}
  .card{background:#1e293b;border-radius:10px;padding:16px}
  .card-title{font-weight:700;margin-bottom:12px;color:#fff;font-size:14px}
  .card-sub{font-size:11px;color:#64748b;margin:-6px 0 12px}
  .grid2{display:grid;grid-template-columns:1fr 1fr;gap:16px}
  .stack{display:flex;flex-direction:column;gap:16px}
  table{width:100%;border-collapse:collapse;font-size:12px}
  th{padding:8px 10px;text-align:left;color:#64748b;font-size:11px;font-weight:700;white-space:nowrap;background:#0f172a}
  td{padding:8px 10px;vertical-align:top}
  .num{text-align:right;white-space:nowrap}
  .badge{font-size:10px;font-weight:700;padding:2px 8px;border-radius:20px;display:inline-block;white-space:nowrap}
  .search-row{display:flex;gap:10px;margin-bottom:14px;flex-wrap:wrap}
  .search-input{flex:1;min-width:200px;padding:8px 12px;border-radius:8px;border:1px solid #334155;background:#1e293b;color:#e2e8f0;font-size:13px;outline:none}
  .filter-sel{padding:8px 12px;border-radius:8px;border:1px solid #334155;background:#1e293b;color:#e2e8f0;font-size:13px;outline:none}
  .table-wrap{background:#1e293b;border-radius:10px;overflow:hidden}
  .table-head{display:grid;grid-template-columns:2fr 1.6fr 1.1fr .6fr 1.3fr 1fr 1fr .9fr;padding:10px 14px;background:#0f172a;font-size:11px;font-weight:700;color:#64748b;gap:8px}
  .table-body{max-height:60vh;overflow-y:auto}
  .table-row{display:grid;grid-template-columns:2fr 1.6fr 1.1fr .6fr 1.3fr 1fr 1fr .9fr;padding:9px 14px;gap:8px;align-items:center;border-bottom:1px solid #0f172a20;font-size:12px}
  .table-foot{padding:8px 14px;font-size:11px;color:#475569;background:#0f172a;display:flex;justify-content:space-between;gap:12px;flex-wrap:wrap}
  .bar-track{height:8px;background:#0f172a;border-radius:4px}
  .bar-fill{height:8px;border-radius:4px}
  .hm-group{margin-bottom:14px}
  .hm-header{display:flex;align-items:center;gap:8px;margin-bottom:8px;flex-wrap:wrap}
  .hm-tot{font-size:11px;color:#94a3b8;background:#0f172a;border-radius:20px;padding:2px 8px}
  .dot{width:12px;height:12px;border-radius:50%;flex-shrink:0}
  .hm-cards{display:flex;flex-wrap:wrap;gap:6px}
  .hm-card{border-radius:8px;padding:6px 10px;min-width:120px;cursor:pointer;transition:opacity .15s}
  .hm-card:hover{opacity:.85}
  .comp-grid{display:grid;grid-template-columns:1.4fr repeat(4,1fr);gap:6px;margin-bottom:8px}
  .comp-cell{border-radius:6px;padding:5px 4px;text-align:center;font-size:10px;font-weight:600}
  .comp-name{font-size:11px;font-weight:600;color:#e2e8f0;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;cursor:pointer;align-self:center}
  .status-item{display:flex;align-items:center;justify-content:space-between;padding:10px 12px;border-radius:8px;margin-bottom:8px;gap:8px}
  .attn-item{padding:10px 12px;border-radius:8px;margin-bottom:8px;cursor:pointer}
  .tot-grid{display:grid;grid-template-columns:repeat(2,1fr);gap:8px}
  .tot-item{background:#0f172a;border-radius:8px;padding:10px 12px}
  .tot-label{font-size:11px;color:#94a3b8}
  .tot-val{font-size:16px;font-weight:800;margin-top:2px}
  .tot-sub{font-size:10px;color:#64748b;margin-top:2px}
  .modal-overlay{position:fixed;inset:0;background:#00000090;z-index:1000;display:flex;align-items:center;justify-content:center}
  .modal-box{background:#1e293b;border:1px solid #334155;border-radius:14px;padding:24px;min-width:320px;max-width:480px;width:92%;max-height:90vh;overflow-y:auto;box-shadow:0 20px 60px #000a}
  .modal-header{display:flex;justify-content:space-between;align-items:flex-start;margin-bottom:18px}
  .modal-title{font-size:16px;font-weight:800;color:#fff}
  .modal-seg{font-size:11px;color:#64748b;margin-top:2px}
  .modal-close{background:none;border:none;color:#64748b;font-size:20px;cursor:pointer;line-height:1;padding:0}
  .modal-close:hover{color:#e2e8f0}
  .modal-row{display:flex;justify-content:space-between;align-items:center;padding:10px 12px;border-radius:8px;margin-bottom:6px;background:#0f172a;gap:10px}
  .modal-row-label{font-size:13px;color:#94a3b8;display:flex;align-items:center;gap:8px}
  .modal-row-val{font-size:14px;font-weight:700;color:#e2e8f0;text-align:right}
  .modal-total{display:flex;justify-content:space-between;align-items:center;padding:12px;border-radius:8px;margin-top:10px;background:#3b82f620;border:1px solid #3b82f640}
  .modal-total-label{font-size:13px;font-weight:700;color:#3b82f6}
  .modal-total-val{font-size:18px;font-weight:800;color:#3b82f6}
  .modal-sec{font-size:11px;color:#64748b;margin:14px 0 8px;font-weight:600;text-transform:uppercase;letter-spacing:.5px}
  .modal-note{font-size:12px;color:#cbd5e1;background:#0f172a;border-radius:8px;padding:10px 12px;line-height:1.45}
  .litigio-banner{background:#1a0a0a;border:2px solid #dc2626;border-radius:12px;padding:16px;margin-bottom:20px}
  .litigio-header{display:flex;align-items:center;gap:10px;margin-bottom:12px;flex-wrap:wrap}
  .litigio-icon{font-size:22px}
  .litigio-title{font-size:15px;font-weight:800;color:#dc2626;letter-spacing:0.5px}
  .litigio-badge{font-size:10px;font-weight:700;padding:2px 8px;border-radius:20px;background:#dc2626;color:#fff;margin-left:4px}
  .litigio-card{background:#2d0a0a;border:1px solid #dc262680;border-radius:10px;padding:12px 16px;display:flex;justify-content:space-between;align-items:center;gap:16px;cursor:pointer}
  .litigio-card-name{font-size:14px;font-weight:800;color:#fca5a5}
  .litigio-card-seg{font-size:11px;color:#94a3b8;margin-top:2px}
  .litigio-card-val{font-size:15px;font-weight:700;color:#dc2626;white-space:nowrap}
  .litigio-pill{font-size:10px;font-weight:700;padding:3px 10px;border-radius:20px;background:#dc262620;color:#dc2626;border:1px solid #dc2626;white-space:nowrap}
  @keyframes pulse-red{0%,100%{box-shadow:0 0 0 0 #dc262640}50%{box-shadow:0 0 0 8px #dc262600}}
  .litigio-banner{animation:pulse-red 2.5s infinite}
  .clk{cursor:pointer}
  .clk:hover{text-decoration:underline}
  @media (max-width:900px){.kpis{grid-template-columns:repeat(2,1fr)}.grid2{grid-template-columns:1fr}.table-head,.table-row{grid-template-columns:2fr 1.2fr 1fr 1.2fr}.hide-sm{display:none}}
</style>

  else if(!auto) st=e.vencDias<=120?'URGENTE':'OK';
  else if(e.ddDias<=30) st='URGENTE';
  else if(r.status==='PRAZO PERDIDO') st='PRAZO PERDIDO'; // travamento já registrado na planilha (datas já no novo ciclo)
  else st='OK';
  e.st=st;
  e.alerta120=!!(e.vencEf&&e.vencDias>=0&&e.vencDias<=120&&st!=='PRAZO PERDIDO'&&st!=='RENOVADO AUTO');
  e.travado=st==='PRAZO PERDIDO'||st==='RENOVADO AUTO';
  return e;
}

// ===================== OPORTUNIDADES =====================
function leadScore(e){
  if(e.st==='A VERIFICAR'||e.val<=0) return 0;
  let m=0.5,why=[],acao='';
  if(e.st==='SEM COBERTURA'){m=3;why.push('Contrato encerrado sem renovação formal');acao='Abordar já: cliente sem cobertura contratual — propor transição assistida.';}
  else if(e.st==='VENCIDO'){m=1.2;why.push('Marcado como vencido');acao='Confirmar se ainda é cliente ALFA; se sim, está sem contrato.';}
  else if(e.travado){m=0.3;why.push('Travado até '+fmtD(e.vencEf));acao='Próxima janela em '+fmtD(e.dlEf)+'. Manter relacionamento e preparar proposta.';}
  else if(e.ddDias<=30){m=2.5;why.push('Janela fecha em '+e.ddDias+'d');acao='Apoiar notificação via AR antes de '+fmtD(e.dlEf)+'.';}
  else if(e.ddDias<=90){m=2;why.push('Janela em '+e.ddDias+'d');acao='Diagnóstico do ambiente + proposta comparativa (TCO).';}
  else if(e.ddDias<=180){m=1.5;why.push('Janela em '+e.ddDias+'d');acao='Nutrir: health-check e comparativo de custos.';}
  else if(e.ddDias<=365){m=1;why.push('Janela em '+e.ddDias+'d');acao='Mapear decisor e insatisfações.';}
  else {why.push('Janela distante');acao='Monitorar.';}
  if(e.litigio){m*=e.st==='SEM COBERTURA'?1.3:2.5;why.unshift('⚖️ Litígio/risco jurídico');if(!acao.startsWith('Abordar'))acao='Relação desgastada — '+acao;}
  if(e.renov&&e.renov!=='auto'&&!e.travado&&e.st!=='SEM COBERTURA'){m*=1.3;why.push('Sem renovação automática');}
  if(e.alerta120&&!why.some(w=>w.includes('120')))why.push('⏰ Vence em ≤120d');
  return {score:Math.round(e.val*m),why:why.join(' · '),acao};
}

// ===================== DADOS AGREGADOS =====================
function getData(){
  const E=raw.map(enrich);
  const totalRec=E.reduce((s,r)=>s+r.val,0);
  const comValor=E.filter(r=>r.val>0).length;
  const vencidos=E.filter(r=>r.st==='VENCIDO'||r.st==='SEM COBERTURA').length;
  const curvaA=E.filter(r=>r.curva==='A').length;
  const sum=a=>a.reduce((s,r)=>s+r.val,0);
  const T={
    mrr:totalRec,arr:totalRec*12,
    janela180:E.filter(r=>!r.travado&&r.ddDias!=null&&r.ddDias>=0&&r.ddDias<=180&&r.st!=='SEM COBERTURA'),
    alerta120:E.filter(r=>r.alerta120),
    semCob:E.filter(r=>r.st==='SEM COBERTURA'||r.st==='VENCIDO'),
    travado:E.filter(r=>r.travado),
    litigio:E.filter(r=>r.litigio),
    verificar:E.filter(r=>r.st==='A VERIFICAR'),
    ok:E.filter(r=>r.st==='OK'),
  };
  T.mrrJanela=sum(T.janela180);T.mrr120=sum(T.alerta120);T.mrrSemCob=sum(T.semCob);T.mrrTravado=sum(T.travado);T.mrrLit=sum(T.litigio);T.mrrVerif=sum(T.verificar);T.mrrOk=sum(T.ok);
  const porSeg=(()=>{const m={};E.forEach(r=>{const s=r.seg||'Sem segmento';if(!m[s])m[s]={seg:s,val:0,count:0,janela:0};m[s].val+=r.val;m[s].count++;if(!r.travado&&r.ddDias!=null&&r.ddDias>=0&&r.ddDias<=180)m[s].janela+=r.val;});return Object.values(m).sort((a,b)=>b.val-a.val);})();
  const maxSeg=porSeg[0]?.val||1;
  const statusCount=(()=>{const m={};E.forEach(r=>{if(!m[r.st])m[r.st]={n:0,val:0};m[r.st].n++;m[r.st].val+=r.val;});return m;})();
  const topC=[...E].filter(r=>r.val>0).sort((a,b)=>b.val-a.val).slice(0,10);
  const dlData=E.filter(r=>r.dlEf).sort((a,b)=>a.ddDias-b.ddDias);
  const proximos=dlData.filter(r=>r.ddDias>=-60&&!r.travado).slice(0,25);
  // recorrência por mês de notificação (próximos 12 meses)
  const meses=[];for(let i=0;i<12;i++){const d=new Date(TODAY.getFullYear(),TODAY.getMonth()+i,1);meses.push({k:iso(d).slice(0,7),lbl:d.toLocaleDateString('pt-BR',{month:'short',year:'2-digit'}),val:0,n:0,nomes:[]});}
  E.forEach(r=>{if(!r.dlEf||r.ddDias<0)return;const mm=meses.find(x=>x.k===r.dlEf.slice(0,7));if(mm){mm.val+=r.val;mm.n++;mm.nomes.push(r.c);}});
  const leads=E.map(e=>({...e,...leadScore(e)})).filter(e=>e.score>0).sort((a,b)=>b.score-a.score);
  const pend=E.map(e=>{const p=[];if(!e.venc)p.push('Sem vencimento');if(e.val<=0)p.push('Sem MRR');if(e.renovPres&&e.venc)p.push('Renovação presumida');if(e.obs&&/inconsistente|Faltam|confirmar|Verificar|não localizad/i.test(e.obs))p.push('Ver observação');return {...e,pend:p};}).filter(e=>e.pend.length&&(e.pend.length>1||!e.pend.includes('Renovação presumida')));
  const lista=E.filter(r=>{
    const q=search.toLowerCase();
    const ms=q===''||r.c.toLowerCase().includes(q)||(r.seg||'').toLowerCase().includes(q)||(r.contrato||'').toLowerCase().includes(q);
    const mf=filtStatus==='Todos'||r.st===filtStatus||(filtStatus==='Litígio'&&r.litigio)||(filtStatus==='Alerta 120d'&&r.alerta120);
    return ms&&mf;
  });
  return{E,T,totalRec,comValor,vencidos,curvaA,porSeg,maxSeg,statusCount,topC,dlData,proximos,meses,leads,pend,lista};
}

    const mx=Math.max(r.cloud,r.lic,r.addon,r.sup,1);
    return `<div class="comp-grid"><div class="comp-name" data-client="${esc(r.c)}" title="${esc(r.c)}">${esc(r.c)}</div>`+[r.cloud,r.lic,r.addon,r.sup].map(v=>`
      <div class="comp-cell" style="background:${v===0?'#0f172a':`rgba(59,130,246,${0.15+(v/mx)*0.85})`};color:${v>0?'#fff':'#334155'}">${v>0?fmtK(v):'—'}</div>`).join('')+`</div>`;
  }).join('');
  return `<div class="stack">
    <div class="grid2">${totCard(d)}${mesesCard(d)}</div>
    <div class="grid2">
      <div class="card"><div class="card-title">🏆 Top 10 por MRR</div>${topCRows}</div>
      <div class="card">
        <div class="card-title">🔥 Componentes (Curva A)</div>
        <div class="comp-grid" style="margin-bottom:8px">
          ${['Cliente','Cloud','Lic.','Addon','Sup.'].map(l=>`<div style="text-align:center;font-size:11px;color:#64748b;font-weight:600">${l}</div>`).join('')}
        </div>
        ${compRows||'<div style="font-size:12px;color:#64748b">Sem composição detalhada.</div>'}
      </div>
    </div>
  </div>`;
}
function renderOpps(d){
  const rows=d.leads.slice(0,40).map((r,i)=>`
    <tr style="border-bottom:1px solid #0f172a20;background:${i%2===0?'#1e293b':'#172033'}">
      <td style="color:#64748b">${i+1}</td>
      <td style="font-weight:700;color:#e2e8f0" class="clk" data-client="${esc(r.c)}">${esc(r.c)}<div style="font-size:10px;color:#64748b;font-weight:400">${esc(r.seg||'—')}</div></td>
      <td class="num" style="color:#3b82f6;font-weight:700">${fmtK(r.val)}<div style="font-size:10px;color:#64748b;font-weight:400">ARR ${fmtK(r.val*12)}</div></td>
      <td><span class="badge" style="color:${SC[r.st]};background:${SC[r.st]}20">${r.st}</span></td>
      <td style="color:#f59e0b;white-space:nowrap">${fmtD(r.dlEf)}<div style="font-size:10px;color:#64748b">${r.ddDias<0?'-'+Math.abs(r.ddDias)+'d':r.ddDias+'d'} · venc. ${fmtD(r.vencEf)}</div></td>
      <td style="color:#cbd5e1;font-size:11px">${esc(r.why)}</td>
      <td style="color:#94a3b8;font-size:11px">${esc(r.acao)}</td>
    </tr>`).join('');
  const pend=d.pend.sort((a,b)=>b.val-a.val).map(r=>`
    <tr style="border-bottom:1px solid #0f172a20">
      <td class="clk" style="font-weight:600;color:#e2e8f0" data-client="${esc(r.c)}">${esc(r.c)}</td>
      <td class="num" style="color:#3b82f6">${r.val>0?fmtK(r.val):'—'}</td>
      <td>${r.pend.map(p=>`<span class="badge" style="color:#94a3b8;background:#33415580;margin:0 4px 4px 0">${p}</span>`).join('')}</td>
    </tr>`).join('');
  const inat=INATIVOS.map(r=>`
    <tr style="border-bottom:1px solid #0f172a20">
      <td style="font-weight:600;color:#e2e8f0">${esc(r.c)}</td>
      <td class="num" style="color:#3b82f6">${r.mrr>0?fmtK(r.mrr):'—'}</td>
      <td style="color:#94a3b8;font-size:11px">${esc(r.info)}</td>
    </tr>`).join('');
  return `<div class="stack">
    <div class="card">
      <div class="card-title">🎯 Ranking de oportunidades</div>
      <div class="card-sub">Score = MRR × urgência da janela × sinais (sem cobertura, litígio, sem renovação automática). Clientes travados aparecem com peso baixo e a próxima janela.</div>
      <div style="overflow-x:auto"><table>
        <thead><tr>${['#','Cliente','MRR','Situação','Notificação','Gatilho','Ação sugerida'].map(h=>`<th>${h}</th>`).join('')}</tr></thead>
        <tbody>${rows}</tbody>
      </table></div>
    </div>
    <div class="grid2">
      <div class="card">
        <div class="card-title">🔎 Pendências de mapeamento (${d.pend.length})</div>
        <div class="card-sub">O que falta levantar para transformar em oportunidade qualificada</div>
        <div style="max-height:420px;overflow-y:auto"><table><thead><tr><th>Cliente</th><th class="num">MRR</th><th>Falta</th></tr></thead><tbody>${pend}</tbody></table></div>
      </div>
      <div class="card">
        <div class="card-title">♻️ Ex-clientes ALFA (pasta Inativos)</div>
        <div class="card-sub">Base para win-back — confirmar quem atende hoje</div>
        <table><thead><tr><th>Cliente</th><th class="num">MRR conhecido</th><th>Contexto</th></tr></thead><tbody>${inat}</tbody></table>
      </div>
    </div>
  </div>`;
}
function renderDeadlines(d){
  const collapsed=window._hmCollapsed||{};
  function makeGroup(gid,dotStyle,titleHtml,list,cardsHtml){
    const isOpen=collapsed[gid]===undefined?true:!collapsed[gid];
    const tot=list.reduce((s,r)=>s+r.val,0);
    return `<div class="hm-group">
      <div class="hm-header" style="cursor:pointer;user-select:none" data-hmg="${gid}">
        ${dotStyle}
        ${titleHtml}
        <span style="font-size:11px;color:#64748b">(${list.length})</span>
        <span class="hm-tot">MRR ${fmtK(tot)} · ARR ${fmtM(tot*12)}</span>
        <span class="hm-arrow" style="font-size:13px;color:#64748b;margin-left:auto;padding-right:4px">${isOpen?'▾':'▸'}</span>
      </div>
      <div class="hm-cards" id="hmg-${gid}" style="display:${isOpen?'flex':'none'}">${cardsHtml}</div>
    </div>`;
  }
  const litigioSection=(()=>{
    const cl=d.T.litigio;
    if(!cl.length)return'';
    const cards=cl.map(r=>`
      <div class="hm-card" style="background:#2d0a0a;border:2px solid #dc2626" data-client="${esc(r.c)}">
        <div style="font-size:11px;font-weight:800;color:#fca5a5">⚖️ ${esc(r.c)}</div>
        <div style="font-size:10px;color:#94a3b8">${esc(r.seg||'—')}</div>
        ${r.dlEf?`<div style="font-size:10px;color:#dc2626;font-weight:700">Notificação: ${fmtD(r.dlEf)}</div>`:''}
        ${r.vencEf?`<div style="font-size:10px;color:#64748b">Vence: ${fmtD(r.vencEf)}</div>`:''}
        ${r.val>0?`<div style="font-size:10px;color:#64748b">${fmtK(r.val)}</div>`:''}
        <div style="margin-top:4px;font-size:9px;font-weight:800;padding:2px 6px;border-radius:10px;background:#dc262620;color:#dc2626;border:1px solid #dc2626;display:inline-block">POSSÍVEL LITÍGIO</div>
      </div>`).join('');
    return makeGroup('litigio',`<div class="dot" style="background:#dc2626;box-shadow:0 0 6px #dc2626"></div>`,`<span style="font-size:12px;font-weight:800;color:#dc2626;letter-spacing:0.5px">⚖️ Possível Litígio</span>`,cl,cards);
  })();
  const travSection=(()=>{
    const cl=d.dlData.filter(r=>r.travado);
    if(!cl.length)return'';
    const cards=cl.map(r=>`
      <div class="hm-card" style="background:#ede9fe;border:1px solid #7c3aed40" data-client="${esc(r.c)}">
        <div style="font-size:11px;font-weight:700;color:#1e293b">🔒 ${esc(r.c)}</div>
        <div style="font-size:10px;color:#475569">Próx. notificação: ${fmtD(r.dlEf)}</div>
        <div style="font-size:10px;color:#7c3aed;font-weight:600">${r.ddDias}d · travado até ${fmtD(r.vencEf)}</div>
        ${r.val>0?`<div style="font-size:10px;color:#64748b">${fmtK(r.val)}</div>`:''}
      </div>`).join('');
    return makeGroup('trav',`<div class="dot" style="background:#7c3aed"></div>`,`<span style="font-size:12px;font-weight:700;color:#a78bfa">🔒 Prazo perdido — renovados automaticamente</span>`,cl,cards);
  })();
  const ativos=d.dlData.filter(r=>!r.travado);
  const heatmap=GRUPOS.map((g,gi)=>{
    const cl=ativos.filter(r=>{const ref=r.st==='SEM COBERTURA'||r.st==='VENCIDO'?-1:r.ddDias;return ref>=g.min&&ref<=g.max;});
    if(!cl.length)return'';
    const cards=cl.map(r=>`
      <div class="hm-card" style="background:${g.bg};border:1px solid ${g.color}40" data-client="${esc(r.c)}">
        <div style="font-size:11px;font-weight:700;color:#1e293b">${esc(r.c)}${r.alerta120?' ⏰':''}</div>
        <div style="font-size:10px;color:#475569">Notificação: ${fmtD(r.dlEf)}</div>
        <div style="font-size:10px;color:${g.color};font-weight:600">${r.st==='SEM COBERTURA'?'Sem cobertura desde '+fmtD(r.vencEf):r.ddDias<0?'Atrasado '+Math.abs(r.ddDias)+'d':r.ddDias+'d p/ notif.'}</div>
        ${r.vencEf?`<div style="font-size:10px;color:#64748b">Vence: ${fmtD(r.vencEf)}</div>`:''}
        ${r.val>0?`<div style="font-size:10px;color:#64748b">${fmtK(r.val)}</div>`:''}
      </div>`).join('');
    return makeGroup('g'+gi,`<div class="dot" style="background:${g.color}"></div>`,`<span style="font-size:12px;font-weight:700;color:${g.color}">${g.label}</span>`,cl,cards);
  }).join('');
  const tableRows=d.proximos.map((r,i)=>{
    const g=GRUPOS.find(g=>r.ddDias>=g.min&&r.ddDias<=g.max)||GRUPOS[5];
    const nc=r.ddDias<=0?'#dc2626':r.ddDias<=30?'#ea580c':r.ddDias<=90?'#d97706':'#16a34a';
    return `<tr style="border-bottom:1px solid #0f172a20;background:${i%2===0?'#1e293b':'#172033'}">
      <td style="color:#64748b">${i+1}</td>
      <td style="font-weight:700;color:#e2e8f0" class="clk" data-client="${esc(r.c)}">${esc(r.c)}${r.litigio?' ⚖️':''}</td>
      <td style="color:#3b82f6;font-weight:700">${r.val>0?fmtK(r.val):'—'}</td>
      <td style="color:#94a3b8">${fmtD(r.dlEf)}</td>
      <td style="color:${g.color};font-weight:700">${r.ddDias<0?'-'+Math.abs(r.ddDias)+'d':r.ddDias+'d'}</td>
      <td style="color:#94a3b8">${fmtD(r.vencEf)}</td>
      <td style="color:#94a3b8;font-size:11px">${r.renov?RENOV_LBL[r.renov]:'Auto (pres.)'}</td>
      <td><span class="badge" style="color:${nc};background:${nc}20">${r.ddDias<=0?'⚡ AGORA':r.ddDias+'d'}</span></td>
    </tr>`;
  }).join('');
  return `<div style="display:flex;flex-direction:column;gap:16px">
    <div class="card">
      <div class="card-title">🗓 Mapa de Calor — Deadline de Notificação</div>
      <div style="font-size:11px;color:#64748b;margin-bottom:14px">Calculado dinamicamente pela data de hoje. Contratos com renovação automática que perderam a janela são projetados para o próximo ciclo. ⏰ = vence em até 120 dias.</div>
      ${litigioSection}
      ${heatmap}
      ${travSection}
    </div>
    <div class="card">
      <div class="card-title">🎯 Próximos a Atacar</div>
      <div style="overflow-x:auto">
        <table>
          <thead><tr>${['#','Cliente','MRR','Notificação','Dias','Vencimento','Renovação','Urgência'].map(h=>`<th>${h}</th>`).join('')}</tr></thead>
          <tbody>${tableRows}</tbody>
        </table>
      </div>
    </div>
  </div>`;
}
function renderSegments(d){
  const bars=d.porSeg.map((s,i)=>`
    <div style="margin-bottom:14px">
      <div style="display:flex;justify-content:space-between;margin-bottom:4px;gap:8px">
        <span style="font-size:13px;color:#e2e8f0;font-weight:600">${esc(s.seg)}</span>
        <div style="display:flex;gap:16px">
          <span style="font-size:11px;color:#64748b">${s.count} clientes</span>
          ${s.janela>0?`<span style="font-size:11px;color:#f59e0b">janela ≤180d ${fmtK(s.janela)}</span>`:''}
          <span style="font-size:13px;color:#3b82f6;font-weight:700">${fmtK(s.val)}</span>
        </div>
      </div>
      <div class="bar-track" style="height:8px">
        <div class="bar-fill" style="height:8px;width:${(s.val/d.maxSeg)*100}%;background:hsl(${210+(i%12)*15},80%,${Math.max(35,55-i*2)}%)"></div>
      </div>
    </div>`).join('');
  return `<div class="card"><div class="card-title">📊 MRR por Segmento</div>${bars}</div>`;
}
function renderStatus(d){
  const ordem=['SEM COBERTURA','VENCIDO','URGENTE','OK','PRAZO PERDIDO','RENOVADO AUTO','A VERIFICAR'];
  const statusItems=ordem.filter(s=>d.statusCount[s]).map(s=>`
    <div class="status-item" style="background:${SB[s]};border:1px solid ${SC[s]}40" title="${esc(ST_DESC[s])}">
      <div style="display:flex;align-items:center;gap:8px">
        <div style="width:10px;height:10px;border-radius:50%;background:${SC[s]}"></div>
        <div><span style="font-size:13px;color:#1e293b;font-weight:600">${s}</span><div style="font-size:10px;color:#475569">${esc(ST_DESC[s])}</div></div>
      </div>
      <div style="text-align:right"><span style="font-size:16px;font-weight:700;color:${SC[s]}">${d.statusCount[s].n}</span><div style="font-size:10px;color:#475569">${fmtK(d.statusCount[s].val)}</div></div>
    </div>`).join('');
  const attn=d.E.filter(r=>r.st==='SEM COBERTURA'||r.st==='VENCIDO'||r.st==='URGENTE'||r.litigio).sort((a,b)=>b.val-a.val);
  const attnItems=attn.map(r=>`
    <div class="attn-item" style="background:${SB[r.st]};border:1px solid ${SC[r.st]}40" data-client="${esc(r.c)}">
      <div style="display:flex;justify-content:space-between;align-items:center;gap:8px">
        <span style="font-size:13px;font-weight:700;color:#1e293b">${esc(r.c)}${r.litigio?' ⚖️':''}</span>
        <span class="badge" style="color:${SC[r.st]};background:${SC[r.st]}20">${r.st}</span>
      </div>
      <div style="font-size:11px;color:#475569;margin-top:2px">${r.val>0?fmt(r.val):'Sem valor'} · ${esc(r.seg||'—')} · notificação ${fmtD(r.dlEf)}</div>
    </div>`).join('');
  return `<div class="grid2">
    <div class="card"><div class="card-title">📌 Por Status (calculado)</div>${statusItems}</div>
    <div class="card"><div class="card-title">🚨 Atenção Imediata (${attn.length})</div><div style="max-height:70vh;overflow-y:auto">${attnItems}</div></div>
  </div>`;
}
function renderLista(d){
  const tot=d.lista.reduce((s,r)=>s+r.val,0);
  const rows=d.lista.map((r,i)=>`
    <div class="table-row" style="background:${i%2===0?'#1e293b':'#172033'}">
      <span class="clk" style="font-weight:600;color:#e2e8f0;text-decoration:underline dotted" data-client="${esc(r.c)}">${esc(r.c)}${r.litigio?' ⚖️':''}</span>
      <span style="color:#94a3b8" class="hide-sm">${esc(r.seg||'—')}</span>
      <span style="color:#3b82f6;font-weight:700">${r.val>0?fmtK(r.val):'—'}</span>
      <span style="color:#8b5cf6;font-weight:700" class="hide-sm">${r.curva||'—'}</span>
      <span><span class="badge" style="color:${SC[r.st]};background:${SC[r.st]}20">${r.st}</span></span>
      <span style="color:#94a3b8;font-size:11px" class="hide-sm">${fmtD(r.vencEf)}</span>
      <span style="color:#f59e0b;font-size:11px">${fmtD(r.dlEf)}</span>
      <span style="color:#64748b;font-size:11px" class="hide-sm">${r.renov?RENOV_LBL[r.renov]:'Auto (pres.)'}</span>
    </div>`).join('');
  const opts=['Todos','OK','URGENTE','SEM COBERTURA','VENCIDO','PRAZO PERDIDO','RENOVADO AUTO','A VERIFICAR','Alerta 120d','Litígio'];
  return `<div>
    <div class="search-row">
      <input id="inp-search" class="search-input" placeholder="🔍 Buscar cliente, segmento ou nº de contrato..." value="${esc(search)}"/>
      <select id="sel-status" class="filter-sel">${opts.map(o=>`<option${filtStatus===o?' selected':''}>${o}</option>`).join('')}</select>
    </div>
    <div class="table-wrap">
      <div class="table-head"><span>CLIENTE</span><span class="hide-sm">SEGMENTO</span><span>MRR</span><span class="hide-sm">CURVA</span><span>STATUS</span><span class="hide-sm">VENCIMENTO</span><span>NOTIFICAÇÃO</span><span class="hide-sm">RENOVAÇÃO</span></div>
      <div class="table-body">${rows}</div>
      <div class="table-foot"><span>${d.lista.length} registros</span><span>MRR ${fmt(tot)} · ARR ${fmt(tot*12)}</span></div>
    </div>
  </div>`;
}
function renderApp(d){
  let tabContent='';
  if(tab==='overview')tabContent=renderOverview(d);
  else if(tab==='opps')tabContent=renderOpps(d);
  else if(tab==='deadlines')tabContent=renderDeadlines(d);
  else if(tab==='segments')tabContent=renderSegments(d);
  else if(tab==='status')tabContent=renderStatus(d);
  else if(tab==='lista')tabContent=renderLista(d);
  return `<div class="app">
    <div class="header">
      <div>
        <div class="header-title">Dashboard Leads</div>
        <div class="header-sub">${raw.length} clientes · base de contratos revisada em ${ATUALIZADO} · hoje ${TODAY.toLocaleDateString('pt-BR')}</div>
      </div>
      <div style="font-size:12px;color:#94a3b8">MRR <b style="color:#3b82f6">${fmt(d.T.mrr)}</b> · ARR <b style="color:#3b82f6">${fmtM(d.T.arr)}</b></div>
    </div>
    <div class="tabs">${tabButtons()}</div>
    <div class="content">
      ${tab==='overview'?renderLitigioBanner(d):''}
      <div class="kpis">${kpiCards(d)}</div>
      ${tabContent}
    </div>
  </div>`;
}
function bindApp(){
  document.querySelectorAll('.tab-btn').forEach(btn=>{
    btn.addEventListener('click',()=>{tab=btn.dataset.tab;render();});
  });
  const si=document.getElementById('inp-search');
  if(si)si.addEventListener('input',e=>{search=e.target.value;render();});
  const ss=document.getElementById('sel-status');
  if(ss)ss.addEventListener('change',e=>{filtStatus=e.target.value;render();});
  document.querySelectorAll('[data-hmg]').forEach(hdr=>{
    hdr.addEventListener('click',()=>{
      const gid=hdr.dataset.hmg;
      if(!window._hmCollapsed)window._hmCollapsed={};
      window._hmCollapsed[gid]=!window._hmCollapsed[gid];
      const body=document.getElementById('hmg-'+gid);
      const arrow=hdr.querySelector('.hm-arrow');
      if(body){
        const open=!window._hmCollapsed[gid];
        body.style.display=open?'flex':'none';
        if(arrow)arrow.textContent=open?'▾':'▸';
      }
    });
  });
}
// Delegação global — captura cliques em data-client independente de quando o DOM muda
document.addEventListener('click',function(e){
  const el=e.target.closest('[data-client]');
  if(el){e.stopPropagation();showClientModal(el.dataset.client);}
});

render();
</script>
</body>
</html>
